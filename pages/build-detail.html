<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流派详情 | 苍云PVP攻略</title>
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/slide.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <div class="container">
            <div id="slider-container"></div>
        </div>
    </main>

<div id="footer-placeholder"></div>

    <script src="../js/components.js"></script>
    <script src="../data/build-data.js"></script>
    <script src="../js/build-slider.js"></script>
    <script src="../js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var params = new URLSearchParams(window.location.search);
        var buildId = params.get('id');
        
        if (!buildId || !window.BuildData.builds[buildId]) {
            document.getElementById('slider-container').innerHTML = 
                '<div style="text-align:center;padding:60px 20px;">' +
                '<h2 style="color:var(--color-primary);">未找到流派配置</h2>' +
                '<p style="color:var(--color-text-muted);margin-top:16px;">请从流派选择页面进入</p>' +
                '<a href="builds.html" style="display:inline-block;margin-top:24px;padding:12px 24px;background:var(--color-primary);color:var(--color-bg-dark);text-decoration:none;border-radius:4px;">返回选择</a>' +
                '</div>';
            return;
        }
        
        var build = window.BuildData.builds[buildId];
        var html = window.BuildSlider.renderBuildDetail(build, buildId);
        document.getElementById('slider-container').innerHTML = html;
        
        window.BuildSlider.init();
        
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'builds.html';
        });
    });
    </script>
    <style>
        @media (max-width: 768px) {
            main {
                padding-top: 80px;
            }
        }
    </style>
</body>
</html>
